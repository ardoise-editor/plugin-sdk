[package]
name = "ardoise-plugin"
version = "0.14.0"
edition = "2021"
rust-version = "1.90"
description = "Write plugins for the Ardoise text editor: the protocol, the manifest, the interface and a runtime"
license = "MIT"
repository = "https://github.com/ardoise-editor/plugin-sdk"
readme = "README.md"
keywords = ["ardoise", "plugin", "editor"]

[features]
# The plugin side: `run` and `Host`. The editor itself only needs the types.
default = ["runtime"]
runtime = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
